---
# Note that dependencies listed here are automatically installed
# before this role.  Role variables for any roles listed here can be
# assigned static variables.
#
# See also cisagov/skeleton-ansible-role#153.
dependencies: []
galaxy_info:
  author: Nicholas McDonnell
  company: CISA Cyber Assessments
  description: Install (or update) MaxMind GeoIP2 database
  galaxy_tags:
    - geoip2
  license: CC0-1.0
  # Ansible-core 2.11 added support for providing `argument_specs` in the role
  # meta file.
  min_ansible_version: "2.11"
  namespace: cisagov
  platforms:
    - name: Amazon Linux
      versions:
        - "2023"
    - name: Debian
      versions:
        - buster
        - bullseye
        - bookworm
        - trixie
        - forky
    - name: Fedora
      versions:
        - "42"
        - "43"
    - name: Kali
      versions:
        - "2023"
    - name: Ubuntu
      versions:
        - jammy
        - noble
  role_name: geoip2
  standalone: true
