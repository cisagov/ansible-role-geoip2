---
argument_specs:
  main:
    author: Nicholas McDonnell
    description: >-
      An Ansible role for installing a MaxMind GeoIP2 database. Additionally, it can
      install the MaxMind `geoipupdate` tool and add a systemd service and timer to
      run the tool at regular intervals.
    options:
      geoip2_database_directory:
        type: str
        default: /usr/local/share/GeoIP/
        description: The directory in which to store the database files.
        required: false
      geoip2_geoipupdate_auto_update:
        type: bool
        default: true
        description: >-
          Whether to configure automatic updates when `geoipupdate` is installed.
        required: false
      geoip2_geoipupdate_service_name:
        type: str
        default: geoipupdate
        description: The name to use for the `geoipupdate` systemd service and timer.
        required: false
      geoip2_geoipupdate_service_timer_on_calendar:
        type: str
        default: Wed,Sat America/New_York
        description: >-
          The calendar expression for the `geoipupdate` systemd timer's `OnCalendar`
          option.
        required: false
      geoip2_geoipupdate_service_timer_randomized_delay_sec:
        type: str
        default: 3h
        description: >-
          The time span value for the `geoipupdate` systemd timer's
          `RandomizedDelaySec` option.
        required: false
      geoip2_geoipupdate_version:
        type: str
        default: 7.0.1
        description: >-
          The version of `geoipupdate` to install. Note that this value should be
          quoted and must represent a release available in the maxmind/geoipupdate
          GitHub repository.
        required: false
      geoip2_install_geoipupdate:
        type: bool
        default: true
        description: Whether to install the `geoipupdate` tool.
        required: false
      geoip2_maxmind_account_id:
        type: str
        description: The MaxMind account ID to use when accessing the MaxMind servers.
        required: true
      geoip2_maxmind_editions:
        type: list
        elements: str
        default:
          - GeoIP2-City
        description: The list of database editions to install.
        required: false
      geoip2_maxmind_license_key:
        type: str
        description: >-
          The MaxMind GeoIP2 license key to use when accessing the MaxMind servers.
        required: true
      geoip2_maxmind_suffix_checksum:
        type: str
        default: tar.gz.sha256
        description: The suffix of the database checksum file to be downloaded.
        required: false
      geoip2_maxmind_suffix_file:
        type: str
        default: tar.gz
        description: The suffix of the database file to be downloaded.
        required: false
      geoip2_maxmind_url_base:
        type: str
        default: https://download.maxmind.com/geoip/databases/%s/download?suffix=%s
        description: >-
          The format of the MaxMind URL, where the first `%s` represents
          `geoip2_maxmind_edition` and the second `%s` represents
          `geoip2_maxmind_suffix_file` or `geoip2_maxmind_suffix_checksum`.
        required: false
    short_description: >-
      Install the MaxMind GeoIP2 database and optionally the geoipupdate tool
    version_added: 1.0.0
