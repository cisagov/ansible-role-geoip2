---
name: build

on:  # yamllint disable-line rule:truthy
  merge_group:
    types:
      - checks_requested
  # We use the default activity types for the pull_request event as specified here:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
  pull_request:
  # Pushes to a branch with an open pull request are already covered by the
  # pull_request event above. Without this filter both events fire for the same
  # commit, running the entire test matrix twice and needlessly doubling the
  # requests made to a MaxMind account that is shared across the organization.
  push:
    branches:
      - develop
  repository_dispatch:
    types:
      - apb

# Set a default shell for any run steps. The `-Eueo pipefail` sets errtrace,
# nounset, errexit, and pipefail. The `-x` will print all commands as they are
# run. Please see the GitHub Actions documentation for more information:
# https://docs.github.com/en/actions/using-jobs/setting-default-values-for-jobs
defaults:
  run:
    shell: bash -Eueo pipefail -x {0}

env:
  # The port on which each test job serves the prefetched MaxMind database to
  # its Molecule containers. See the prefetch-database job below.
  GEOIP2_CACHE_PORT: 8099
  PIP_CACHE_DIR: ~/.cache/pip
  PRE_COMMIT_CACHE_DIR: ~/.cache/pre-commit
  RUN_TMATE: ${{ secrets.RUN_TMATE }}
  TERRAFORM_DOCS_REPO_BRANCH_NAME: cisagov
  TERRAFORM_DOCS_REPO_DEPTH: 1
  TERRAFORM_DOCS_REPO_URL: https://github.com/mcdonnnj/terraform-docs.git

jobs:
  diagnostics:
    name: Run diagnostics
    # This job does not need any permissions
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      # Note that a duplicate of this step must be added at the top of
      # each job.
      - name: Apply standard cisagov job preamble
        uses: cisagov/action-job-preamble@v1
        with:
          check_github_status: "true"
          # This functionality is poorly implemented and has been
          # causing problems due to the MITM implementation hogging or
          # leaking memory.  As a result we disable it by default.  If
          # you want to temporarily enable it, simply set
          # monitor_permissions equal to "true".
          #
          # TODO: Re-enable this functionality when practical.  See
          # cisagov/skeleton-generic#207 for more details.
          monitor_permissions: "false"
          output_workflow_context: "true"
          # Use a variable to specify the permissions monitoring
          # configuration. By default this will yield the
          # configuration stored in the cisagov organization-level
          # variable, but if you want to use a different configuration
          # then simply:
          # 1. Create a repository-level variable with the name
          # ACTIONS_PERMISSIONS_CONFIG.
          # 2. Set this new variable's value to the configuration you
          # want to use for this repository.
          #
          # Note in particular that changing the permissions
          # monitoring configuration *does not* require you to modify
          # this workflow.
          permissions_monitoring_config: ${{ vars.ACTIONS_PERMISSIONS_CONFIG }}
  lint:
    needs:
      - diagnostics
    permissions:
      # actions/checkout needs this to fetch code
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Apply standard cisagov job preamble
        uses: cisagov/action-job-preamble@v1
        with:
          # This functionality is poorly implemented and has been
          # causing problems due to the MITM implementation hogging or
          # leaking memory.  As a result we disable it by default.  If
          # you want to temporarily enable it, simply set
          # monitor_permissions equal to "true".
          #
          # TODO: Re-enable this functionality when practical.  See
          # cisagov/skeleton-generic#207 for more details.
          monitor_permissions: "false"
          # Use a variable to specify the permissions monitoring
          # configuration. By default this will yield the
          # configuration stored in the cisagov organization-level
          # variable, but if you want to use a different configuration
          # then simply:
          # 1. Create a repository-level variable with the name
          # ACTIONS_PERMISSIONS_CONFIG.
          # 2. Set this new variable's value to the configuration you
          # want to use for this repository.
          #
          # Note in particular that changing the permissions
          # monitoring configuration *does not* require you to modify
          # this workflow.
          permissions_monitoring_config: ${{ vars.ACTIONS_PERMISSIONS_CONFIG }}
      - id: setup-env
        uses: cisagov/setup-env-github-action@v1
      - uses: actions/checkout@v6
      - id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.setup-env.outputs.python-version }}
      # We need the Go version and Go cache location for the actions/cache step,
      # so the Go installation must happen before that.
      - id: setup-go
        uses: actions/setup-go@v6
        with:
          # There is no expectation for actual Go code so we disable caching as
          # it relies on the existence of a go.sum file.
          cache: false
          go-version: ${{ steps.setup-env.outputs.go-version }}
      - id: go-cache
        name: Lookup Go cache directory
        run: |
          echo "dir=$(go env GOCACHE)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        env:
          BASE_CACHE_KEY: >-
            ${{ github.job }}-${{ runner.os
            }}-py${{ steps.setup-python.outputs.python-version
            }}-go${{ steps.setup-go.outputs.go-version
            }}-packer${{ steps.setup-env.outputs.packer-version
            }}-tf${{ steps.setup-env.outputs.terraform-version }}-
        with:
          key: >-
            ${{ env.BASE_CACHE_KEY }}${{
            hashFiles('**/requirements-test.txt') }}-${{
            hashFiles('**/requirements.txt') }}-${{
            hashFiles('**/.pre-commit-config.yaml') }}
          # Note that the .terraform directory IS NOT included in the
          # cache because if we were caching, then we would need to use
          # the `-upgrade=true` option. This option blindly pulls down the
          # latest modules and providers instead of checking to see if an
          # update is required. That behavior defeats the benefits of caching.
          # so there is no point in doing it for the .terraform directory.
          path: |
            ${{ env.PIP_CACHE_DIR }}
            ${{ env.PRE_COMMIT_CACHE_DIR }}
            ${{ steps.go-cache.outputs.dir }}
          restore-keys: |
            ${{ env.BASE_CACHE_KEY }}
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ steps.setup-env.outputs.packer-version }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.setup-env.outputs.terraform-version }}
      - name: Install go-critic
        env:
          PACKAGE_URL: github.com/go-critic/go-critic/cmd/go-critic
          PACKAGE_VERSION: ${{ steps.setup-env.outputs.go-critic-version }}
        run: go install ${PACKAGE_URL}@${PACKAGE_VERSION}
      - name: Install goimports
        env:
          PACKAGE_URL: golang.org/x/tools/cmd/goimports
          PACKAGE_VERSION: ${{ steps.setup-env.outputs.goimports-version }}
        run: go install ${PACKAGE_URL}@${PACKAGE_VERSION}
      - name: Install gosec
        env:
          PACKAGE_URL: github.com/securego/gosec/v2/cmd/gosec
          PACKAGE_VERSION: ${{ steps.setup-env.outputs.gosec-version }}
        run: go install ${PACKAGE_URL}@${PACKAGE_VERSION}
      - name: Install staticcheck
        env:
          PACKAGE_URL: honnef.co/go/tools/cmd/staticcheck
          PACKAGE_VERSION: ${{ steps.setup-env.outputs.staticcheck-version }}
        run: go install ${PACKAGE_URL}@${PACKAGE_VERSION}
      # TODO: https://github.com/cisagov/skeleton-generic/issues/165
      # We are temporarily using a branch of @mcdonnnj's fork of terraform-docs that
      # groups changes from his PRs until they are approved and merged:
      # https://github.com/terraform-docs/terraform-docs/pull/745
      # https://github.com/terraform-docs/terraform-docs/pull/901
      # This temporary fix will allow for ATX header support when terraform-docs is run
      # during linting and output delimiter rows with cell spacing that passes
      # Markdownlint's MD060/table-column-style rule.
      - name: Clone ATX headers branch from terraform-docs fork
        run: |
          git clone \
           --branch $TERRAFORM_DOCS_REPO_BRANCH_NAME \
           --depth $TERRAFORM_DOCS_REPO_DEPTH \
           --single-branch \
           $TERRAFORM_DOCS_REPO_URL /tmp/terraform-docs
      - name: Build and install terraform-docs binary
        run: |
          go build \
          -C /tmp/terraform-docs \
          -o $(go env GOPATH)/bin/terraform-docs
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install --upgrade --requirement requirements-test.txt
      - name: Set up pre-commit hook environments
        run: pre-commit install-hooks
      - name: Run pre-commit on all files
        run: pre-commit run --all-files
      - name: Setup tmate debug session
        uses: mxschmitt/action-tmate@v3
        if: env.RUN_TMATE
  # Download each MaxMind database named in geoip2_maxmind_editions, along with
  # its checksum, exactly once, then share them with every test job through the
  # Actions cache.
  #
  # Previously each test job downloaded its own copies, so a single workflow run
  # made roughly one hundred requests to MaxMind. The credentials are
  # organization-level secrets shared by every cisagov repository, and MaxMind
  # caps an account at 1,000 database downloads per 24 hours, so that volume is
  # worth avoiding. MaxMind also recommends downloading to a local repository
  # and distributing from there rather than fetching per host.
  prefetch-database:
    name: Prefetch MaxMind databases
    needs:
      - diagnostics
    permissions:
      # actions/checkout needs this to fetch code
      contents: read
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.editions.outputs.key }}
      editions: ${{ steps.editions.outputs.list }}
    steps:
      - name: Apply standard cisagov job preamble
        uses: cisagov/action-job-preamble@v1
        with:
          monitor_permissions: "false"
          permissions_monitoring_config: ${{ vars.ACTIONS_PERMISSIONS_CONFIG }}
      - id: checkout-repo
        name: Checkout the repository
        uses: actions/checkout@v6
      - id: editions
        name: Determine the database editions and cache key
        run: |
          # geoip2_maxmind_editions in defaults/main.yml is the single source of
          # truth for which databases this role installs, so read the list from
          # there instead of duplicating it here. Note that yq is preinstalled
          # on the Ubuntu runner images, and that it exits non-zero when the key
          # is absent, which the emptiness check below also covers.
          editions=$(yq '.geoip2_maxmind_editions | join(" ")' \
            defaults/main.yml || true)
          if [ -z "$editions" ]; then
            echo "::error::Could not read a non-empty geoip2_maxmind_editions" \
              "from defaults/main.yml."
            exit 1
          fi
          echo "Editions: $editions"
          echo "list=$editions" >> "$GITHUB_OUTPUT"
          # MaxMind publishes new databases on Tuesdays and Fridays, so a daily
          # key keeps the cached copies reasonably fresh while letting every run
          # in a given day reuse one set of downloads. The digest of the edition
          # list is included so that adding or removing an edition cannot reuse
          # a cache that is missing it.
          digest=$(printf '%s' "$editions" | sha256sum | cut -c1-12)
          echo "key=maxmind-${digest}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v5
        with:
          key: ${{ steps.editions.outputs.key }}
          path: maxmind-cache
      - name: Download the databases and checksums from MaxMind
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          EDITIONS: ${{ steps.editions.outputs.list }}
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          mkdir -p maxmind-cache
          for edition in $EDITIONS; do
            url_base=https://download.maxmind.com/geoip/databases/$edition/download
            for suffix in tar.gz tar.gz.sha256; do
              # Do not add x-amz-* headers here. MaxMind redirects to a
              # Cloudflare R2 presigned URL, and SigV4 requires every x-amz-*
              # header sent to be listed in that URL's X-Amz-SignedHeaders; R2
              # rejects anything else with a SignatureDoesNotMatch 403. See the
              # note in tasks/install_database_edition.yml. Retries are used
              # because this is the only place the workflow talks to MaxMind.
              curl --fail --silent --show-error --location \
                --retry 5 --retry-delay 15 --retry-all-errors \
                --user "${MAXMIND_ACCOUNT_ID}:${MAXMIND_LICENSE_KEY}" \
                --output "maxmind-cache/${edition}.${suffix}" \
                "${url_base}?suffix=${suffix}"
            done
          done
      - name: Verify each cached archive matches its cached checksum
        env:
          EDITIONS: ${{ steps.editions.outputs.list }}
        run: |
          cd maxmind-cache
          for edition in $EDITIONS; do
            # A checksum file holds "<sha256>  <dated filename>". The role only
            # consumes the hash, and the filename will not match the name we
            # cache under, so compare hashes directly rather than using
            # sha256sum --check.
            expected=$(awk '{print $1}' "${edition}.tar.gz.sha256")
            actual=$(sha256sum "${edition}.tar.gz" | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "::error::Cached ${edition} archive does not match its" \
                "cached checksum."
              exit 1
            fi
            echo "Verified cached ${edition}: $actual"
          done
  test:
    name: >-
      test (${{ matrix.scenario }}) -
      ${{ matrix.platform }}-${{ matrix.architecture }}
    needs:
      - diagnostics
      - prefetch-database
    permissions:
      # actions/checkout needs this to fetch code
      contents: read
    # This line is long, but if I use a block style indicator then GH
    # Actions doesn't parse and execute the expression.
    # yamllint disable-line rule:line-length
    runs-on: ubuntu-${{ startsWith(matrix.architecture, 'arm') && '24.04-arm' || 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - amd64
          - arm64
        platform:
          - amazonlinux2023-systemd
          - debian10-systemd
          - debian11-systemd
          - debian12-systemd
          - debian13-systemd
          - debian14-systemd
          - fedora42-systemd
          - fedora43-systemd
          - kali-systemd
          - ubuntu-22-systemd
          - ubuntu-24-systemd
          - ubuntu-26-systemd
        scenario:
          - default
          - install_geoipupdate
          - missing_required_variables
    steps:
      - name: Apply standard cisagov job preamble
        uses: cisagov/action-job-preamble@v1
        with:
          # This functionality is poorly implemented and has been
          # causing problems due to the MITM implementation hogging or
          # leaking memory.  As a result we disable it by default.  If
          # you want to temporarily enable it, simply set
          # monitor_permissions equal to "true".
          #
          # TODO: Re-enable this functionality when practical.  See
          # cisagov/skeleton-ansible-role#227 for more details.
          monitor_permissions: "false"
          # Use a variable to specify the permissions monitoring
          # configuration. By default this will yield the
          # configuration stored in the cisagov organization-level
          # variable, but if you want to use a different configuration
          # then simply:
          # 1. Create a repository-level variable with the name
          # ACTIONS_PERMISSIONS_CONFIG.
          # 2. Set this new variable's value to the configuration you
          # want to use for this repository.
          #
          # Note in particular that changing the permissions
          # monitoring configuration *does not* require you to modify
          # this workflow.
          permissions_monitoring_config: ${{ vars.ACTIONS_PERMISSIONS_CONFIG }}
      - id: setup-env
        uses: cisagov/setup-env-github-action@v1
      - uses: actions/checkout@v6
      - id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.setup-env.outputs.python-version }}
      - uses: actions/cache@v5
        env:
          BASE_CACHE_KEY: >-
            ${{ github.job }}-${{ runner.os }}-py${{
            steps.setup-python.outputs.python-version }}-
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: >-
            ${{ env.BASE_CACHE_KEY }}${{
            hashFiles('**/requirements-test.txt') }}-${{
            hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ env.BASE_CACHE_KEY }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --requirement requirements-test.txt
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # AppArmor interferes when running Molecule tests against Fedora
      # 40 and 41; it does not allow the privileged container to run
      # sudo and hence Ansible is unable to do anything.  See
      # fedora-cloud/docker-brew-fedora#117 for more details.
      #
      # There is a growing consensus that AppArmor causes too many
      # problems and should not be active on the short-lived GitHub
      # runners.  See, for example,
      # actions/runner-images/issues/10015.  To avoid problems in the
      # future, it makes sense to simply disable AppArmor altogether
      # before running Molecule tests.
      - name: Disable AppArmor
        uses: cisagov/action-disable-apparmor@v1
      - id: database-source
        name: Determine whether this job uses the prefetched databases
        # One job is deliberately left downloading straight from MaxMind so
        # that CI keeps exercising the real Cloudflare R2 presigned-URL path.
        # MaxMind has changed which headers those URLs are signed with before
        # now, and serving every job from the cache would hide such a change
        # until it broke a production build. The missing_required_variables
        # scenario fails before it downloads anything, so it needs neither the
        # cache nor the server.
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          this=$SCENARIO/$PLATFORM/$ARCHITECTURE
          if [ "$this" = default/debian12-systemd/amd64 ] \
            || [ "$SCENARIO" = missing_required_variables ]
          then
            echo "use-cache=false" >> "$GITHUB_OUTPUT"
          else
            echo "use-cache=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the prefetched MaxMind databases
        if: steps.database-source.outputs.use-cache == 'true'
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          key: ${{ needs.prefetch-database.outputs.cache-key }}
          path: maxmind-cache
      - name: Serve the prefetched databases to the Molecule containers
        if: steps.database-source.outputs.use-cache == 'true'
        # The containers reach this server via their default gateway, which is
        # the Docker bridge address of this runner.
        env:
          EDITIONS: ${{ needs.prefetch-database.outputs.editions }}
        run: |
          nohup python3 -m http.server "$GEOIP2_CACHE_PORT" \
            --bind 0.0.0.0 --directory maxmind-cache \
            > /tmp/geoip2-cache-server.log 2>&1 &
          # Confirm every edition is actually being served before Molecule runs,
          # so that a problem here is not later misreported as a MaxMind
          # download failure. The server is backgrounded above and takes a
          # moment to bind, hence the retries; --retry-connrefused is needed
          # because --retry on its own does not retry a refused connection.
          for edition in $EDITIONS; do
            if ! curl --fail --silent --output /dev/null \
              --retry 10 --retry-delay 1 --retry-connrefused \
              "http://127.0.0.1:$GEOIP2_CACHE_PORT/${edition}.tar.gz.sha256"
            then
              echo "Database cache server is not serving ${edition}" >&2
              cat /tmp/geoip2-cache-server.log >&2
              exit 1
            fi
          done
          echo "Database cache server is serving: $EDITIONS"
      - name: Run molecule tests
        env:
          GEOIP2_USE_LOCAL_CACHE: ${{ steps.database-source.outputs.use-cache }}
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: >-
          molecule test
          --platform-name ${{ matrix.platform }}-${{ matrix.architecture }}
          --scenario-name ${{ matrix.scenario }}
      - name: Setup tmate debug session
        uses: mxschmitt/action-tmate@v3
        if: env.RUN_TMATE
